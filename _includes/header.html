<header class="site-header">
    <div class="header-content">
        <!-- Левая часть - Лого/Имя -->
        <div class="header-brand">
            <h1 class="name-title">{{ site.author.name }}</h1>
            <p class="job-title">{{ site.data[page.lang].common.job_title }}</p>
        </div>
        <!-- Правая часть - Контакты и управление -->
        <div class="header-controls">
            <!-- Управление -->
            <div class="header-actions">
                <div class="lang-switcher">
                    <a href="/cova.github.io/" class="lang-link{% if page.lang == 'en' %} active{% endif %}">EN</a>
                    <span class="divider">|</span>
                    <a href="/cova.github.io/ru" class="lang-link{% if page.lang == 'ru' %} active{% endif %}">RU</a>
                </div>

                <button id="theme-toggle" class="theme-toggle" aria-label="Toggle theme">
                    <span class="icon sun">☀️</span>
                    <span class="icon moon">🌙</span>
                </button>

                {% capture pdf_path %}/assets/docs/Igor-Cova-{{ page.lang | upcase }}.pdf{% endcapture %}
                <a href="{{ pdf_path | relative_url }}" download class="download-pdf" aria-label="Download PDF">
                    <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
                        <polyline points="7 10 12 15 17 10"></polyline>
                        <line x1="12" y1="15" x2="12" y2="3"></line>
                    </svg>
                    <span>PDF</span>
                </a>
            </div>
        </div>
    </div>
</header>
