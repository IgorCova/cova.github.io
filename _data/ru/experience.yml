- company: "Сравни.ру"
  position: "Техлид / Ведущий инженер-разработчик"
  dates: "Август 2022 - Настоящее время"
  projects:
    - name: "Проект: Платформа банковских вкладов"
      description: |
        Техлид кросс-функциональной команды из 10 человек (4 backend, 3 frontend, 3 QA) на платформе полной сделки по вкладам финансового маркетплейса.

        - Перепроектировал архитектуру системы полной сделки и перевёл её с PHP на микросервисы .NET, что повысило стабильность и расширяемость платформы
        - Спроектировал сквозной процесс полной сделки и интеграции с банками-партнёрами
        - Автоматизировал сверки с банками и платёжными системами, процессы возвратов и финансового учёта по сделкам
        - Внедрил Kafka как основу событийной модели и реализовал автопродление вкладов через SAGA-хореографию
        - Мигрировал данные с MongoDB на PostgreSQL
        - Разработал гибридный кеш-менеджер с Circuit Breaker для отказоустойчивости сервисов
        - Выстроил observability: метрики и алертинг в Prometheus и Grafana, трассировка в Jaeger, логи в Kibana; провёл нагрузочное тестирование на k6
        - Сделал админку для поддержки: управление продуктами, отчёты по клиентам и сделкам
        - Провожу код-ревью, принимаю архитектурные решения, декомпозирую задачи; отвечаю за надёжность и скорость ответа сервисов в проде

        **Стек:** C# / .NET, PostgreSQL, MongoDB, Kafka, MassTransit, Kubernetes, ArgoCD, Prometheus, Grafana, Jaeger, Kibana

    - name: "Проект: КАСКО (страхование)"
      description: |
        - Разработал с нуля сервис полной сделки по КАСКО
        - Интегрировал страховые компании-партнёры
        - Оптимизировал процессы обработки данных
        - Реализовал систему мониторинга ошибок

        **Стек:** C# / .NET, Entity Framework, PostgreSQL, ClickHouse, RabbitMQ, Kafka, MassTransit, Redis, xUnit, Kubernetes, ArgoCD, Prometheus, Grafana, OpenSearch/Kibana, Jaeger
