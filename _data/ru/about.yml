text: |
    Backend-инженер с 13-летним опытом коммерческой разработки на C# / .NET, специализируюсь на высоконагруженных отказоустойчивых системах в финтехе: платежи, банковские продукты, страхование. Последние 4 года — техлид кросс-функциональной команды из 10 человек в Сравни.ру, где перепроектировал платформу банковских вкладов и перевёл её с PHP на микросервисы .NET.

    Сильные стороны — финансовые процессы (сверки с банками и платёжными системами, возвраты, учёт), интеграции с банками и платёжными системами, миграции legacy-систем и событийная архитектура на Kafka с SAGA-паттернами. Основной стек: C#, .NET, PostgreSQL, Kafka, RabbitMQ, MassTransit, Redis, Kubernetes; также писал продакшн-сервисы на Go и Node.js (TypeScript).
