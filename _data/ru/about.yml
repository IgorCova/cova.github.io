text: |
    Привет! Я — backend-инженер с 13 годами опыта в коммерческой разработке. Основной язык — C# / .NET. Специализируюсь на высоконагруженных отказоустойчивых системах в финтехе: платежи, банковские продукты, страхование.
    
    Мой основной стек: C#, .NET, PostgreSQL, Kafka, RabbitMQ, Redis, Kubernetes. Также писал продакшн-сервисы на Go и Node.js (TypeScript).
        
    **Имею глубокий опыт работы с:**
    - Финансовыми процессами: сверками с банками и платёжными системами, возвратами, финансовым учётом
    - Интеграцией платёжных систем и банковских протоколов
    - Legacy-системами: разбором, рефакторингом и миграциями (PHP → .NET, MongoDB → PostgreSQL)
    - Проектированием событийно-ориентированных систем и микросервисной архитектуры
    - Реализацией сложных бизнес-процессов через SAGA-паттерны
    - Проектированием и оптимизацией реляционных баз данных
    - CI/CD, Kubernetes и observability (Prometheus, Grafana, Jaeger)
    
    Как техлид провожу код-ревью и участвую в архитектурных решениях команды.
    Умею находить баланс между качеством и скоростью разработки.
    Активно использую паттерны проектирования, принципы SOLID и AI-ассистентов в своей работе.
