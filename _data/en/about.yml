text: |
    Backend engineer with 13 years of commercial experience in C# / .NET, specializing in high-load, fault-tolerant fintech systems: payments, banking products and insurance. For the last 4 years I have been the tech lead of a 10-person cross-functional team at Sravni.ru, where I redesigned the bank deposits platform and migrated it from PHP to .NET microservices.

    My strengths are financial processes (reconciliations with banks and payment systems, refunds, accounting), bank and payment system integrations, legacy migrations, and event-driven architecture on Kafka with SAGA patterns. Core stack: C#, .NET, PostgreSQL, Kafka, RabbitMQ, MassTransit, Redis, Kubernetes; I have also built production services in Go and Node.js (TypeScript).
